[package]
name = "musicforge-gui"
version = "0.10.0"
edition = "2021"
license = "MIT"
description = "MusicForge GUI (Tauri 2): offline, reliable, observable ncm converter"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 生产构建必须启用：启用后 Tauri 嵌入 frontendDist 资源而非连接 devUrl
custom-protocol = ["tauri/custom-protocol"]
# P6a（D8）：GUI 发行版默认含插件 host——release 构建命令须同时携带
# --features musicforge-gui/custom-protocol,musicforge-gui/plugin-host；
# 开发/调试构建不带它时零插件符号。
plugin-host = ["musicforge-cli/plugin-host"]

[dependencies]
# tray-icon：系统托盘（关闭窗口 = 隐藏到托盘 + 托盘菜单控制播放）。
tauri = { version = "2", features = ["tray-icon"] }
# 原生文件/目录/保存对话框。仅注册为 Rust 侧插件，不向 JS 暴露 API
# ——前端只能通过下面白名单化的命令调用，ACL 面最小。
tauri-plugin-dialog = "2"
# ---- P5 系统集成：单实例（发布必备——双开实例会抢音频设备与状态库）----
# 第二个实例启动时聚焦既有窗口并把 .ncm 参数转发过去。
tauri-plugin-single-instance = "2"
# ---- P5 更新：唯一网络行为（dependency-policy.md 显式例外）----
# HTTPS 拉取 GitHub Releases 的 latest.json + minisign 签名校验；
# 只注册 Rust 侧，JS API 不授权——前端只能走白名单命令（check/install/restart）。
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
musicforge-cli = { path = "../../musicforge-cli" }
musicforge-core = { path = "../../musicforge-core" }
# ---- P2 播放引擎（仅桌面端；core 保持零音频依赖——dependency-policy.md）----
# symphonia：纯 Rust 解码（mp3/flac/aac/alac/vorbis/wav/m4a 容器）。
# 不用 rodio：其抽象天花板会迫使后期重写（位深/独占/Dop 全部不可及）。
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "flac", "aac", "alac", "vorbis", "ogg", "wav", "pcm", "isomp4",
] }
# cpal：跨平台音频输出（WASAPI / CoreAudio / ALSA）。
cpal = "0.15"

# ---- 系统媒体键 / 媒体面板（仅 Windows / macOS）----
# souvlaki：Windows SMTC / macOS Now Playing（系统媒体面板 + 键盘媒体键）。
# Windows/macOS 后端是内建 target cfg，无需 feature（features 只服务 Linux
# 的 dbus/zbus 后端）。刻意排除 Linux：其 Linux 后端依赖 libdbus，
# musl 交叉编译不可行（CI 的 musl build job 会因此失败）；MPRIS 留待后续。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
souvlaki = { version = "0.8", default-features = false }

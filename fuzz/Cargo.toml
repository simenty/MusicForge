[package]
name = "musicforge-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.musicforge-core]
path = "../musicforge-core"
version = "0.11.0"

[dependencies.musicforge-plugin-api]
path = "../musicforge-plugin-api"
version = "0.11.0"

[[bin]]
name = "ncm_header"
path = "fuzz_targets/ncm_header.rs"
test = false
doc = false

[[bin]]
name = "cue_parse"
path = "fuzz_targets/cue_parse.rs"
test = false
doc = false

[[bin]]
name = "metadata_parse"
path = "fuzz_targets/metadata_parse.rs"
test = false
doc = false

[[bin]]
name = "protocol_parse"
path = "fuzz_targets/protocol_parse.rs"
test = false
doc = false

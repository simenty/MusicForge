<!doctype html>

<head><meta charset="utf-8"><title>MusicForge 首启向导</title></head>
<body>
  <h1>MusicForge 首启向导</h1>
  <ol>
    <li>系统设置 → 应用 → MusicForge → +文件夹：授权音乐库（只读）、输出目录（读写）、回收站（读写）</li>
    <li>查看访问 token：应用数据目录 data/.token 或服务日志首启段落</li>
    <li>浏览器访问 http://127.0.0.1:8787 并粘贴 token</li>
  </ol>
  <p>详见应用内帮助（docs/help.md）。</p>
</body>
</html>

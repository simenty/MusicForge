name: Reusable · Test + Lint

# 可复用工作流（P3-27）：三平台 test + clippy + 源级禁令扫描。
#
# 为什么抽出来：此前 `release-gate.yml` 只跑 `scripts/release-check.sh`，
# 而 CI 的 test / supply-chain **只在分支 push 上触发** → 打 tag 发布时这两个门禁
# 根本没跑，等于可绕过。抽成本文件后，ci.yml 与 release-gate.yml 复用**同一份定义**，
# 「任何 tag 都跑过与分支同样的测试」成为结构保证而非人为约定。
#
# 只声明 workflow_call：本文件不会被任何事件直接触发，仅被调用。
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 全 workflow 统一 bash：Windows runner 默认 pwsh，bash 条件脚本会 ParserError
defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # rust-toolchain.toml 会把工具链切到 pinned 1.98.0，clippy 组件需补装
      - name: Ensure clippy component (pinned toolchain)
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-node@v4
        if: matrix.os != 'ubuntu-latest'
        with:
          node-version: '20'

      - name: Build frontend（tauri 宏在编译期嵌入 ../ui/dist，CI 上必须先产出）
        if: matrix.os != 'ubuntu-latest'
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Lint（零 warning 目标；ubuntu 无 GTK，GUI 延后同 test/build job）
        # --all-targets 必带：不带时只扫 lib/bin，测试文件里的 warning 会全部漏掉
        # （2026-09-02 实测：加上后才暴露 13 处历史遗留，已修）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo clippy --workspace --exclude musicforge-gui --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi

      - name: 全量测试（golden + 单元 + 集成；ubuntu 无 GTK，GUI 延后同 build job）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --exclude musicforge-gui
          else
            cargo test --workspace
          fi

      - name: 零网络扫描（源级：use/依赖树）
        run: |
          grep -rn "use std::net\|use tokio::net\|reqwest\|ureq\|hyper::client" \
            musicforge-core/src/ musicforge-cli/src/ && exit 1 || echo "零网络 ✓"
          cargo tree -p musicforge-core -p musicforge-cli 2>/dev/null | grep -iE "net|http|reqwest" \
            && exit 1 || echo "依赖树零网络 ✓"

      - name: 零 panic 扫描（核心库禁 panic!）
        run: |
          grep -rn "panic!(" musicforge-core/src/ --include="*.rs" \
            | grep -v "test\|#\[cfg(test)\]" && exit 1 || echo "零 panic ✓"

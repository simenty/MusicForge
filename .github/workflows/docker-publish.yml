name: Docker (GHCR)

# P8/X25-T3：容器交付——多阶段构建 scratch 镜像（<40MB 零插件）→ GHCR。
# 触发 = 版本 tag（发布节奏与 Release/FPK 对齐）+ 手动。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build（不推送，先验大小）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mf-size-check:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 镜像大小验收（P8：<40MB 零插件）
        run: |
          BYTES=$(docker image inspect mf-size-check:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "image size: ${MB} MB"
          if [ "$MB" -ge 40 ]; then
            echo "::error::镜像 ${MB}MB 超过 40MB 验收上限"; exit 1
          fi

      - name: 冒烟（容器内 /api/health 免鉴权可达）
        run: |
          CID=$(docker run -d -p 18787:8787 mf-size-check:ci)
          for i in 1 2 3 4 5; do
            sleep 2
            if BODY=$(curl -fsS http://127.0.0.1:18787/api/health 2>/dev/null); then
              echo "$BODY"; echo "$BODY" | grep -q '"status":"ok"'
              docker rm -f "$CID" > /dev/null
              exit 0
            fi
            docker logs "$CID" 2>&1 | tail -5 || true
          done
          echo "::error::15s 内 /api/health 不可达"; exit 1

      - name: Meta tags（v* → 版本号 + latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

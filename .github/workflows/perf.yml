name: Perf Baseline (Regression Gate)

# PF-5：性能回归门禁。perf_baseline 测试仅在设置 MF_PERF_N 时运行，
# 现断言各项预算（扫描 / Plan / 哈希热 / 哈希内存峰值），任一灾难性回归
# （如 PF-1 的 2× 内存峰值）即令测试失败、CI 转红。
#
# 触发限定（避免每次 PR 都跑 100k fixture 重 IO、拖慢 PR）：
#   - push 到 main/master：回归一旦合入主线即报警；
#   - workflow_dispatch：按需手动跑；
#   - 每夜 cron：趋势看护。
# 运行于 windows-latest：内存峰值（PeakWorkingSet）仅 Windows 口径有效。

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # 每夜 03:17 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  MF_PERF_N: "100000"

defaults:
  run:
    shell: bash

jobs:
  perf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: 运行性能基线（断言预算；回归即失败）
        run: cargo test --release --test perf_baseline -- --nocapture 2>&1 | tee perf.log

      - name: 性能汇总写入 Job Summary
        if: always()
        run: |
          {
            echo "## 性能基线 (N=${MF_PERF_N})"
            echo '```'
            grep -E "\[scan\]|\[plan\]|\[hash|\[memory\]|小结|PERF-GATE|PASS|FAIL" perf.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

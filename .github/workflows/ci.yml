name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 全 workflow 统一 bash：Windows runner 默认 pwsh，bash 条件脚本会 ParserError
defaults:
  run:
    shell: bash

jobs:
  # ---- 形态/契约护栏（P0）：把"靠人记的约束"变成 CI 断言 ----
  # 起因：B24–B27 四次真机故障的共同根因是约束无自动化校验。
  #   - 契约一致性 → 前后端漂移 / 后端能力未露出
  #   - fpk 结构   → B25（micro_app 缺失）/ B26（wizard 非 JSON）应在 CI 拦截
  #   - 版本一致性 → 版本-内容漂移
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 前端依赖（vitest 属 devDependency，不进产物）
        run: npm --prefix musicforge-gui/ui ci

      - name: 前端测试（纯函数 + i18n 字典同构 + 组件交互/确认闸）
        run: npm --prefix musicforge-gui/ui test

      - name: ESLint（前端静态检查：hooks 依赖 / 未用变量 / 正确性）
        run: npm --prefix musicforge-gui/ui run lint

      - name: 契约一致性（server 路由 vs 前端调用）
        run: bash scripts/check-api-contract.sh

      - name: fpk 结构校验（manifest / wizard / ui-config）
        run: bash scripts/check-fpk-structure.sh

      - name: 版本一致性（core / fpk / tauri）
        run: bash scripts/check-version-consistency.sh

      - name: UI 错误边界覆盖（Panel/Card 组件必须位于 ErrorBoundary 内）
        run: bash scripts/check-ui-boundaries.sh

  # ---- 覆盖率门禁（P2）：cargo-llvm-cov（LLVM source-based，行覆盖）----
  # 策略（避免「门禁形同虚设」与「每次提交都红」两个极端）：
  # - 绝对下限而非「不下降」：单人项目没有稳定的基线存储，绝对阈值更可预测；
  # - 阈值留足余量，只在覆盖率**上升后**上调；下调必须在提交信息里说明理由；
  # - 口径与 test job 一致（--workspace --exclude musicforge-gui：Linux 无 GTK）。
  coverage:
    runs-on: ubuntu-latest
    env:
      # 阈值策略：基线 − 余量。CI 实测基线（2026-09-11 首轮）：行覆盖 78.73%
      # （Regions 79.22% / Functions 76.71% / 9769 行）。
      # 70 = 基线留 ~8.7 个百分点余量：小幅波动不红，实质性退步（新增代码大量无测）必红。
      # 调整规则：覆盖率上升后随之上调；下调需在提交信息说明理由。
      COVERAGE_MIN: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Ensure llvm-tools (pinned toolchain)
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: 覆盖率（行覆盖低于阈值即失败；汇总行是本 job 的关键输出）
        run: |
          cargo llvm-cov --workspace --exclude musicforge-gui \
            --fail-under-lines "$COVERAGE_MIN" --summary-only

      - name: 覆盖率汇总写入 Job Summary（一眼可见，无需翻日志）
        if: always()
        run: |
          {
            echo "## 覆盖率（cargo-llvm-cov · 行覆盖门禁 $COVERAGE_MIN%）"
            echo '```'
            cargo llvm-cov report --summary-only || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: 生成 lcov 报告（供本地消费 / 后续趋势分析）
        if: always()
        run: cargo llvm-cov report --lcov --output-path lcov.info || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  # ---- 测试 + lint（三平台）----
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      # rust-toolchain.toml 会把工具链切到 pinned 1.98.0，clippy 组件需补装
      - name: Ensure clippy component (pinned toolchain)
        run: rustup component add clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/setup-node@v4
        if: matrix.os != 'ubuntu-latest'
        with:
          node-version: '20'

      - name: Build frontend（tauri 宏在编译期嵌入 ../ui/dist，CI 上必须先产出）
        if: matrix.os != 'ubuntu-latest'
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Lint（零 warning 目标；ubuntu 无 GTK，GUI 延后同 test/build job）
        # --all-targets 必带：不带时只扫 lib/bin，测试文件里的 warning 会全部漏掉
        # （2026-09-02 实测：加上后才暴露 13 处历史遗留，已修）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo clippy --workspace --exclude musicforge-gui --all-targets -- -D warnings
          else
            cargo clippy --workspace --all-targets -- -D warnings
          fi

      - name: 全量测试（golden + 单元 + 集成；ubuntu 无 GTK，GUI 延后同 build job）
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --exclude musicforge-gui
          else
            cargo test --workspace
          fi

      - name: 零网络扫描（源级：use/依赖树）
        run: |
          grep -rn "use std::net\|use tokio::net\|reqwest\|ureq\|hyper::client" \
            musicforge-core/src/ musicforge-cli/src/ && exit 1 || echo "零网络 ✓"
          cargo tree -p musicforge-core -p musicforge-cli 2>/dev/null | grep -iE "net|http|reqwest" \
            && exit 1 || echo "依赖树零网络 ✓"

      - name: 零 panic 扫描（核心库禁 panic!）
        run: |
          grep -rn "panic!(" musicforge-core/src/ --include="*.rs" \
            | grep -v "test\|#\[cfg(test)\]" && exit 1 || echo "零 panic ✓"

  # ---- Release 构建（三平台产物）----
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          # P7：musl 静态链接（ROADMAP P7 验收：musl 裸容器跑通）
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ""
          # P8：ARM NAS（fnOS/群晖 ARM 机型）——aarch64 musl 静态（server + CLI）
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml 会切到 pinned 1.98.0，其 std 需单独为交叉目标补装
      - name: Add target std for pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # musl 静态链接需要 C 编译器（rusqlite bundled 会编译 sqlite3.c）；
      # aarch64 musl 用 aarch64-linux-gnu-gcc 作 linker（musl crt 来自 rust std）
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # aarch64 musl：gnu gcc 编 C 会带 glibc fortify 语义（__memcpy_chk/open64），
      # musl crt 链接必炸 → 用 cargo-zigbuild（zig 充当 C 编译器/linker）
      - name: Setup cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2
        if: matrix.target == 'aarch64-unknown-linux-musl'
        with:
          version: 0.13.0

      - name: Build CLI + Server (release)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release -p musicforge-cli -p musicforge-server --target ${{ matrix.target }}

      - name: Build CLI + Server (release, zigbuild aarch64-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release -p musicforge-cli -p musicforge-server --target aarch64-unknown-linux-musl

      # P7/P8：unix 产物统一打包（server+CLI 同树；Windows 安装包由 release-installer 负责）
      - name: Package CLI+Server（unix：dist 树 + tar.gz + sha256）
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          VERSION=$(grep '^version' musicforge-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          PKG="musicforge-v${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/musicforge" "dist/$PKG/"
          cp "target/${{ matrix.target }}/release/musicforge-server" "dist/$PKG/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "$PKG"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      # P7 验收：musl 裸容器跑通（alpine 零 glibc 环境可启动执行）
      # P2-2：生命周期冒烟（含**升级路径**——B27 只在升级时暴露，全新安装测不出）
      - name: 生命周期冒烟（start/status/重复 start/升级残留/stop/重启）
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          bash scripts/check-lifecycle.sh \
            target/x86_64-unknown-linux-gnu/release/musicforge-server \
            musicforge-fpk/cmd/main

      - name: musl 裸容器冒烟（alpine）
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm -v "$PWD/target/x86_64-unknown-linux-musl/release:/mf:ro" alpine sh -c "
            /mf/musicforge --version &&
            /mf/musicforge --help | head -15
          "

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/musicforge${{ matrix.suffix }}
            target/${{ matrix.target }}/release/musicforge-server${{ matrix.suffix }}
            dist/*.tar.gz
            dist/*.tar.gz.sha256

      - uses: actions/setup-node@v4
        if: matrix.os != 'ubuntu-latest'
        with:
          node-version: '20'

      - name: Build frontend（GUI 构建前置）
        if: matrix.os != 'ubuntu-latest'
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Build GUI (release, 非 Linux——Linux GUI 延后)
        if: matrix.os != 'ubuntu-latest'
        run: cargo build --release -p musicforge-gui --target ${{ matrix.target }}

      - name: Upload GUI artifact
        if: matrix.os != 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-gui-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/musicforge-gui${{ matrix.suffix }}

  # ---- 供应链确定性（tag 触发时校验 zip 字节一致）----
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install cargo-deny & cargo-audit
        uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny check（全仓：许可证 + DB 服务端客户端/GPL 传输）
        run: cargo deny check licenses bans sources

      - name: cargo deny check（core+cli 严格网络禁令，GUI 由 tauri 合法引入 http 栈）
        run: cargo deny --config deny.core.toml check bans

      - name: cargo audit（RustSec 公告）
        run: cargo audit

      - name: 源码正则扫描（核心/CLI 零网络字面量：URL/TcpStream/UdpSocket）
        run: |
          grep -rnE "https?://|TcpStream::|UdpSocket::" musicforge-core/src/ musicforge-cli/src/ \
            && exit 1 || echo "源码零网络字面量 ✓"

      - name: 默认构建 feature 断言（默认构建无插件宿主/云层）
        run: |
          cargo tree -e features -p musicforge-core -p musicforge-cli 2>/dev/null | grep -iE "plugin-host|musicforge-cloud" \
            && exit 1 || echo "默认构建零插件宿主/云层 ✓"

      # P7（ROADMAP）：cfg 只在壳层——业务源码禁平台 cfg attribute（测试模块的
      # cfg(test)/feature 门控不受限；平台行为差异收敛到运行时 env/路径探测）
      - name: 平台差异壳层闸（cfg 只在壳层）
        run: |
          grep -rnE '#\[cfg\((target_os|windows|unix|not\((windows|unix|target_os)' \
            musicforge-core/src/ musicforge-cli/src/ musicforge-plugin-api/src/ musicforge-plugin-host/src/ \
            && exit 1 || echo "core/cli 业务源码零平台 cfg ✓"

  # ---- 断网行为测试（P0.5 第 4 层）：有网构建 → iptables 断网 → 跑金标 ----
  offline-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build golden tests（有网：拉取 crates）
        run: cargo test -p musicforge-core --test golden --no-run

      - name: Run golden tests WITHOUT network（iptables 全断出口，跑完即恢复）
        run: |
          sudo iptables -A OUTPUT ! -o lo -j DROP
          cargo test -p musicforge-core --test golden
          RC=$?
          sudo iptables -D OUTPUT ! -o lo -j DROP
          exit $RC

name: Release (multi-platform)

# 触发：
#   1. push tag `v*`（正式发布；版本号取 tag 去掉 v 前缀）
#   2. workflow_dispatch 手动灰度（必须填 version）
#
# 2026-09-05(v0.1.1) 修复三处潜伏缺陷：
#   a. GUI 构建补 `--features musicforge-gui/custom-protocol`（前端资产内联必须）
#   b. GUI 构建前先产出前端 dist（tauri 宏编译期嵌入 ../ui/dist）
#   c. dist 树补 `使用说明.txt`（NSIS File 指令必需，缺失会让 makensis 直接失败）
# 2026-09-08(P7)：多平台交付（ROADMAP P7 / D26）——
#   构建三 job（windows NSIS+zip / linux-musl 静态 tar.gz / macos aarch64 tar.gz）
#   → assemble job 统一生成全资产 SHA256SUMS.txt 一次上传（GH Release 唯一事实源）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  nsis:
    runs-on: windows-latest
    # P6：安装包签名（updater minisign）——未配置 secret 时相关步骤自动跳过
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend（GUI 构建前置）
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Build GUI（release + custom-protocol + plugin-host：前端资产内联必须；P6a D8 发行版默认含插件 host）
        run: cargo build --release -p musicforge-gui --features musicforge-gui/custom-protocol,musicforge-gui/plugin-host

      - name: Build CLI
        run: cargo build --release -p musicforge-cli

      - name: Stage dist tree
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist\musicforge-v$env:VERSION-windows-x64" | Out-Null
          Copy-Item target\release\musicforge.exe      "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item target\release\musicforge-gui.exe  "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item README.md, LICENSE                 "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item installer\assets\使用说明.txt       "dist\musicforge-v$env:VERSION-windows-x64\"

      - name: Build zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          Compress-Archive -Path "dist\musicforge-v$env:VERSION-windows-x64" `
            -DestinationPath "dist\musicforge-v$env:VERSION-windows-x64.zip" -CompressionLevel Optimal

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Compile installer
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" /INPUTCHARSET UTF8 `
            /DVERSION=$env:VERSION musicforge.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      # P6：给**同一个安装包**做 updater 签名（minisign）——自动更新与手动下载
      # 从此指向同一载体（P5.5 安装器双轨问题在此收敛）。无密钥 → 跳过。
      - name: Sign installer for updater
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node ..\musicforge-gui\ui\node_modules\@tauri-apps\cli\tauri.js signer sign "MusicForge-$env:VERSION-setup.exe"
          if (-not (Test-Path "MusicForge-$env:VERSION-setup.exe.sig")) { throw "签名未产出" }

      - name: Smoke test（静默安装 → 卸载 → 校验清理）
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $exe = ".\MusicForge-$env:VERSION-setup.exe"
          Write-Host "installer path: $(Resolve-Path $exe) | exists: $(Test-Path $exe)"
          $out = & $exe /S 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "installer exit code: $code"
          Write-Host "installer output:`n$out"
          if ($code -ne 0) {
            Write-Host "::error::silent install failed (exit $code) - see installer output above"
            throw "silent install failed (exit $code)"
          }
          $dir = "$env:LOCALAPPDATA\Programs\MusicForge"
          Start-Sleep -Seconds 3
          Write-Host "install dir contents: $((Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', ')"
          if (-not (Test-Path "$dir\musicforge-gui.exe")) { throw "musicforge-gui.exe missing after install" }
          if (-not (Test-Path "$dir\musicforge.exe"))     { throw "musicforge.exe missing after install" }
          & "$dir\Uninstall.exe" /S
          if ($LASTEXITCODE -ne 0) { throw "silent uninstall failed" }
          Start-Sleep -Seconds 2
          if (Test-Path $dir) { throw "install dir not removed: $dir" }
          Write-Host "::notice::install/uninstall lifecycle OK"

      - name: Upload artifacts（发布之外的工作区留档；发布由 release job 统一执行）
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-windows-${{ steps.ver.outputs.version }}
          path: |
            installer/MusicForge-${{ steps.ver.outputs.version }}-setup.exe
            installer/MusicForge-${{ steps.ver.outputs.version }}-setup.exe.sig
            dist/musicforge-v${{ steps.ver.outputs.version }}-windows-x64.zip

  # ---- P7：unix CLI 资产（musl 静态 + macos aarch64；GUI CLI 先行不打包）----
  unix-assets:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # rust-toolchain.toml 会把工具链切到 pinned 1.98.0，其 std 需单独为交叉目标补装
      # （与 ci.yml build job 相同处理；dtolnay 的 targets 只作用于它装的 stable——
      #  v0.8.0 首跑 E0463 教训：musl crate 解析报 can't find crate for `core`）
      - name: Add target std for pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build CLI (release)
        run: cargo build --release -p musicforge-cli --target ${{ matrix.target }}

      - name: Package（dist 树 + tar.gz + sha256）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKG="musicforge-v${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/musicforge" "dist/$PKG/"
          cp README.md LICENSE "dist/$PKG/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "$PKG"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-unix-${{ matrix.target }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # ---- P6.9：Linux GUI（deb + AppImage；未签名 beta）----
  # 与 gui-portability.yml 的 push 验证同构；这里是**正式资产**（进 Release）。
  # updater 产物关闭（--config）——跨平台自动更新后置，免签名密钥。
  linux-gui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system deps（webkit2gtk-4.1 / appindicator / rsvg / alsa / patchelf）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Build GUI（deb + AppImage）
        working-directory: musicforge-gui
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js build --features plugin-host \
            --bundles deb,appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package（统一命名）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/musicforge-v${VERSION}-linux-x86_64.deb"
          APPIMG=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          cp "$APPIMG" "dist/musicforge-v${VERSION}-linux-x86_64.AppImage"
          chmod +x "dist/musicforge-v${VERSION}-linux-x86_64.AppImage"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-linux-gui-${{ steps.ver.outputs.version }}
          path: dist/*

  # ---- P6.9：macOS GUI（dmg；未签名 beta——用户需手动放行）----
  macos-gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Build GUI（dmg）
        working-directory: musicforge-gui
        run: |
          node ui/node_modules/@tauri-apps/cli/tauri.js build --features plugin-host \
            --bundles dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package（统一命名）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          cp "$DMG" "dist/musicforge-v${VERSION}-macos-aarch64.dmg"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-macos-gui-${{ steps.ver.outputs.version }}
          path: dist/*

  # ---- P7 / D26：统一发布（全资产 + 唯一 SHA256SUMS.txt）----
  release:
    needs: [nsis, unix-assets, linux-gui, macos-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # P4-4：SBOM 由仓库脚本生成（cargo metadata 读 Cargo.lock），需先取源码
      - uses: actions/checkout@v4

      - name: Generate SBOM (CycloneDX from cargo metadata)
        shell: bash
        run: |
          mkdir -p assets
          node scripts/gen-sbom.mjs "${{ steps.ver.outputs.version }}" > assets/SBOM.cdx.json
          echo "SBOM 组件数: $(grep -c '\"type\": \"library\"' assets/SBOM.cdx.json)"

      - name: Download windows assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-windows-${{ steps.ver.outputs.version }}
          path: assets/win

      - name: Download linux-musl assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-unix-x86_64-unknown-linux-musl-${{ steps.ver.outputs.version }}
          path: assets/linux

      - name: Download macos assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-unix-aarch64-apple-darwin-${{ steps.ver.outputs.version }}
          path: assets/macos

      - name: Download linux GUI assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-linux-gui-${{ steps.ver.outputs.version }}
          path: assets/linuxgui

      - name: Download macos GUI assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-macos-gui-${{ steps.ver.outputs.version }}
          path: assets/macosgui

      # v0.8.0 首跑教训：download-artifact 保留 artifact 内部子路径（installer/、
      # dist/）——直连 glob 匹配不到。先按来源分目录下载，再展平到 assets 根。
      - name: 展平资产 + 统一 SHA256SUMS（D26：GH Release 唯一事实源）
        shell: bash
        working-directory: assets
        run: |
          find win linux macos linuxgui macosgui -type f \
            \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" -o -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \) \
            -exec mv {} . \;
          sha256sum MusicForge-*.exe *.zip *.tar.gz *.deb *.AppImage *.dmg SBOM.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # P9 / D6：来源可验证性——桌面线此前只签 updater 安装包（TAURI_SIGNING_PRIVATE_KEY），
      # 而 D26「唯一事实源」SHA256SUMS.txt **未签名**：替换二进制者可一并替换校验和，
      # 校验和不具备抗篡改能力。复用 fpk 线同一个脚本对 assets/ 全量签名（含 SHA256SUMS.txt）。
      # 未配置密钥 / 未装 minisign → 脚本跳过并 exit 0，**绝不阻断发布**（与 fpk 线一致）。
      - name: Sign release artifacts (minisign)
        shell: bash
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            printf '%s' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
            chmod 600 "$RUNNER_TEMP/minisign.key"
            export MINISIGN_SECRET_KEY="$RUNNER_TEMP/minisign.key"
            # 只在确实有密钥时才装 minisign：未配置密钥的发布不该为此付出 apt 开销
            command -v minisign >/dev/null 2>&1 || {
              sudo apt-get update -qq && sudo apt-get install -y -qq minisign
            }
          fi
          # 公钥随产物分发（同 fpk 线约定）：仓库根 minisign.pub 存在时一并上传
          if [ -f minisign.pub ]; then cp minisign.pub assets/minisign.pub; fi
          bash scripts/sign-artifacts.sh assets
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MusicForge v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            assets/MusicForge-${{ steps.ver.outputs.version }}-setup.exe
            assets/musicforge-v${{ steps.ver.outputs.version }}-windows-x64.zip
            assets/musicforge-v${{ steps.ver.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            assets/musicforge-v${{ steps.ver.outputs.version }}-aarch64-apple-darwin.tar.gz
            assets/musicforge-v${{ steps.ver.outputs.version }}-linux-x86_64.deb
            assets/musicforge-v${{ steps.ver.outputs.version }}-linux-x86_64.AppImage
            assets/musicforge-v${{ steps.ver.outputs.version }}-macos-aarch64.dmg
            assets/SHA256SUMS.txt
            assets/SBOM.cdx.json
            assets/*.minisig
            assets/minisign.pub

  # ---- P6：updater 元数据（latest.json）----
  # 安装器统一（P5.5 遗留修复）：latest.json 指向 **nsis job 的同一个自定义安装包**
  # （+ 其 minisign 签名）——用户手动下载与自动更新从此是同一载体，安装路径不再漂移。
  # 本 job 不再重编译（省 ~15 分钟）：只聚合 nsis artifact → 写 latest.json → 附加 Release。
  # 未配置签名密钥时整 job 跳过（不影响既有发布线）。
  updater:
    needs: [release]
    runs-on: windows-latest
    steps:
      - name: Guard（签名密钥缺失 → 跳过）
        id: guard
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY 未配置：跳过 latest.json（见 docs/release.md）"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve version
        if: steps.guard.outputs.skip == 'false'
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download windows installer（含签名）
        if: steps.guard.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: musicforge-windows-${{ steps.ver.outputs.version }}
          path: win

      - name: Stage latest.json
        if: steps.guard.outputs.skip == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $exe = Get-ChildItem -Recurse win -Filter "MusicForge-*-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "未找到安装包（nsis artifact）" }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) {
            throw "签名缺失：$($exe.Name).sig —— 检查 nsis job 的 Sign installer 步骤与 secret"
          }
          $sig = (Get-Content $sigFile -Raw).Trim()
          New-Item -ItemType Directory -Force -Path dist-updater | Out-Null
          $json = @{
            version   = $env:VERSION
            notes     = "见 GitHub Release 说明"
            pub_date  = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = "https://github.com/${{ github.repository }}/releases/download/v${env:VERSION}/MusicForge-${env:VERSION}-setup.exe"
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content "dist-updater/latest.json" $json -Encoding utf8
          Write-Host "latest.json → $($exe.Name)"

      - name: Attach to GitHub Release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            dist-updater/latest.json
            win/installer/*.exe.sig


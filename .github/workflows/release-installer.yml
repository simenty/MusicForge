name: Release (multi-platform)

# 触发：
#   1. push tag `v*`（正式发布；版本号取 tag 去掉 v 前缀）
#   2. workflow_dispatch 手动灰度（必须填 version）
#
# 2026-09-05(v0.1.1) 修复三处潜伏缺陷：
#   a. GUI 构建补 `--features musicforge-gui/custom-protocol`（前端资产内联必须）
#   b. GUI 构建前先产出前端 dist（tauri 宏编译期嵌入 ../ui/dist）
#   c. dist 树补 `使用说明.txt`（NSIS File 指令必需，缺失会让 makensis 直接失败）
# 2026-09-08(P7)：多平台交付（ROADMAP P7 / D26）——
#   构建三 job（windows NSIS+zip / linux-musl 静态 tar.gz / macos aarch64 tar.gz）
#   → assemble job 统一生成全资产 SHA256SUMS.txt 一次上传（GH Release 唯一事实源）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.1"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend（GUI 构建前置）
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Build GUI（release + custom-protocol + plugin-host：前端资产内联必须；P6a D8 发行版默认含插件 host）
        run: cargo build --release -p musicforge-gui --features musicforge-gui/custom-protocol,musicforge-gui/plugin-host

      - name: Build CLI
        run: cargo build --release -p musicforge-cli

      - name: Stage dist tree
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path "dist\musicforge-v$env:VERSION-windows-x64" | Out-Null
          Copy-Item target\release\musicforge.exe      "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item target\release\musicforge-gui.exe  "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item README.md, LICENSE                 "dist\musicforge-v$env:VERSION-windows-x64\"
          Copy-Item installer\assets\使用说明.txt       "dist\musicforge-v$env:VERSION-windows-x64\"

      - name: Build zip
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          Compress-Archive -Path "dist\musicforge-v$env:VERSION-windows-x64" `
            -DestinationPath "dist\musicforge-v$env:VERSION-windows-x64.zip" -CompressionLevel Optimal

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Compile installer
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          & "C:\Program Files (x86)\NSIS\Bin\makensis.exe" /INPUTCHARSET UTF8 `
            /DVERSION=$env:VERSION musicforge.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }

      - name: Smoke test（静默安装 → 卸载 → 校验清理）
        shell: pwsh
        working-directory: installer
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $exe = ".\MusicForge-$env:VERSION-setup.exe"
          Write-Host "installer path: $(Resolve-Path $exe) | exists: $(Test-Path $exe)"
          $out = & $exe /S 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "installer exit code: $code"
          Write-Host "installer output:`n$out"
          if ($code -ne 0) {
            Write-Host "::error::silent install failed (exit $code) - see installer output above"
            throw "silent install failed (exit $code)"
          }
          $dir = "$env:LOCALAPPDATA\Programs\MusicForge"
          Start-Sleep -Seconds 3
          Write-Host "install dir contents: $((Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', ')"
          if (-not (Test-Path "$dir\musicforge-gui.exe")) { throw "musicforge-gui.exe missing after install" }
          if (-not (Test-Path "$dir\musicforge.exe"))     { throw "musicforge.exe missing after install" }
          & "$dir\Uninstall.exe" /S
          if ($LASTEXITCODE -ne 0) { throw "silent uninstall failed" }
          Start-Sleep -Seconds 2
          if (Test-Path $dir) { throw "install dir not removed: $dir" }
          Write-Host "::notice::install/uninstall lifecycle OK"

      - name: Upload artifacts（发布之外的工作区留档；发布由 release job 统一执行）
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-windows-${{ steps.ver.outputs.version }}
          path: |
            installer/MusicForge-${{ steps.ver.outputs.version }}-setup.exe
            dist/musicforge-v${{ steps.ver.outputs.version }}-windows-x64.zip

  # ---- P7：unix CLI 资产（musl 静态 + macos aarch64；GUI CLI 先行不打包）----
  unix-assets:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml 会把工具链切到 pinned 1.98.0，其 std 需单独为交叉目标补装
      # （与 ci.yml build job 相同处理；dtolnay 的 targets 只作用于它装的 stable——
      #  v0.8.0 首跑 E0463 教训：musl crate 解析报 can't find crate for `core`）
      - name: Add target std for pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build CLI (release)
        run: cargo build --release -p musicforge-cli --target ${{ matrix.target }}

      - name: Package（dist 树 + tar.gz + sha256）
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          PKG="musicforge-v${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$PKG"
          cp "target/${{ matrix.target }}/release/musicforge" "dist/$PKG/"
          cp README.md LICENSE "dist/$PKG/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "$PKG"
          ( cd dist && sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicforge-unix-${{ matrix.target }}-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # ---- P7 / D26：统一发布（全资产 + 唯一 SHA256SUMS.txt）----
  release:
    needs: [nsis, unix-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download windows assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-windows-${{ steps.ver.outputs.version }}
          path: assets/win

      - name: Download linux-musl assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-unix-x86_64-unknown-linux-musl-${{ steps.ver.outputs.version }}
          path: assets/linux

      - name: Download macos assets
        uses: actions/download-artifact@v4
        with:
          name: musicforge-unix-aarch64-apple-darwin-${{ steps.ver.outputs.version }}
          path: assets/macos

      # v0.8.0 首跑教训：download-artifact 保留 artifact 内部子路径（installer/、
      # dist/）——直连 glob 匹配不到。先按来源分目录下载，再展平到 assets 根。
      - name: 展平资产 + 统一 SHA256SUMS（D26：GH Release 唯一事实源）
        shell: bash
        working-directory: assets
        run: |
          find win linux macos -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.tar.gz" \) -exec mv {} . \;
          sha256sum MusicForge-*.exe *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: MusicForge v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            assets/MusicForge-${{ steps.ver.outputs.version }}-setup.exe
            assets/musicforge-v${{ steps.ver.outputs.version }}-windows-x64.zip
            assets/musicforge-v${{ steps.ver.outputs.version }}-x86_64-unknown-linux-musl.tar.gz
            assets/musicforge-v${{ steps.ver.outputs.version }}-aarch64-apple-darwin.tar.gz
            assets/SHA256SUMS.txt

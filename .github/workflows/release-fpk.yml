name: Release FPK (fnOS)

# P8/D27/X35：fnOS native FPK 双架构打包（amd64 + arm64）。
# R23：fnpack Windows 工具链粗糙 → 固定 Linux runner。
#
# X35（2026-09-09 定稿）：fnpack 1.2.3 官方源（developer.fnnas.com/docs/cli/fnpack/
# → static2.fnnas.com 直链）；manifest 字段规范 v1.1.8 已校准（appname/platform/
# source=thirdparty/service_port/desktop_applaunchname）；打包检查表
# （manifest / config privilege+resource / 双 ICON / app / cmd / wizard）全部就位。

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - ".github/workflows/release-fpk.yml"
      - "musicforge-fpk/**"
      - "musicforge-server/**"
  workflow_dispatch:

env:
  FNPACK_VERSION: 1.2.3

jobs:
  fpk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: x86
            target: x86_64-unknown-linux-musl
            tools: musl-tools
            linker: ""
          - arch: arm64
            platform: arm
            target: aarch64-unknown-linux-musl
            tools: musl-tools
            linker: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.tools }}
      - name: Set linker
        if: matrix.linker != ''
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build frontend (SPA → app/ui)
        run: |
          npm --prefix musicforge-gui/ui ci
          npm --prefix musicforge-gui/ui run build

      - name: Setup cargo-zigbuild (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.target == 'aarch64-unknown-linux-musl'
        with:
          version: 0.13.0

      - name: Build server + CLI (musl static)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release -p musicforge-cli -p musicforge-server --target ${{ matrix.target }}
      - name: Build server + CLI (zigbuild aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo zigbuild --release -p musicforge-cli -p musicforge-server --target aarch64-unknown-linux-musl

      - name: Download fnpack
        run: |
          curl -fL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      - name: Assemble FPK tree
        run: |
          VERSION=$(grep '^version' musicforge-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp -r musicforge-fpk fpk
          mkdir -p fpk/app/ui/images
          # fnOS desktop entry config (sample: Fnos-Hermes-Studio app/ui/config) --
          # entry name must equal manifest desktop_applaunchname; icon {0} = size slot
          echo '{}' > fpk/app/ui/config
          # multi-size icons (placeholder 1x1, real icons later)
          cp musicforge-fpk/ICON_256.PNG fpk/app/ui/images/icon_256.png
          cp musicforge-fpk/ICON.PNG fpk/app/ui/images/icon_64.png          cp "target/${{ matrix.target }}/release/musicforge-server" fpk/app/
          cp "target/${{ matrix.target }}/release/musicforge" fpk/app/
          cp -r musicforge-gui/ui/dist/* fpk/app/ui/
          # X35：manifest 按官方 v1.1.8 字段填充（key=value，无冒号）
          sed -i "s/^platform=.*/platform=${{ matrix.platform }}/" fpk/manifest
          sed -i "s/^version=.*/version=$VERSION/" fpk/manifest
          chmod +x fpk/cmd/main fpk/cmd/install_init fpk/cmd/install_callback \
            fpk/cmd/upgrade_init fpk/cmd/upgrade_callback \
            fpk/cmd/uninstall_init fpk/cmd/uninstall_callback \
            fpk/cmd/config_init fpk/cmd/config_callback

      - name: Build FPK
        run: |
          cd fpk
          fnpack build
          cd ..
          ls -la fpk/*.fpk || find . -name "*.fpk" -print

      - name: Collect artifacts
        run: |
          mkdir -p fpk-out
          echo "-- fpk dir --"
          ls -la fpk/ | head -20
          find . -name "*.fpk" -print
          find . -name "*.fpk" -exec cp -v {} fpk-out/ \;
          ls -la fpk-out/
          if ls fpk-out/*.fpk >/dev/null 2>&1; then ( cd fpk-out && sha256sum ./*.fpk > SHA256SUMS-fpk.txt ); else echo "::error::no .fpk produced" && exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: musicforge-fpk-${{ matrix.arch }}
          path: fpk-out/*

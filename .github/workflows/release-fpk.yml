name: Release FPK (fnOS)

# P8/D27：fnOS native FPK 双架构打包（amd64 + arm64）。
# R23：fnpack Windows 工具链粗糙 → 固定 Linux runner。
#
# X35（真机阶段定稿项）：FNPACK_URL 为 fnpack 官方 Linux 二进制下载地址——
# 未配置时本工作流显式跳过（不失败），避免 CI 红灯；真机联调时定稿 URL 与
# manifest 字段全集（fnpack create 校准）。

on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - ".github/workflows/release-fpk.yml"
      - "musicforge-fpk/**"
      - "musicforge-server/**"
  workflow_dispatch:

jobs:
  fpk:
    if: ${{ vars.FNPACK_URL != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            tools: musl-tools
            linker: ""
          - arch: arm64
            target: aarch64-unknown-linux-musl
            tools: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: rustup target add ${{ matrix.target }}

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.tools }}
      - name: Set linker
        if: matrix.linker != ''
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Build server + CLI (musl static)
        run: cargo build --release -p musicforge-cli -p musicforge-server --target ${{ matrix.target }}

      - name: Assemble FPK tree
        run: |
          VERSION=$(grep '^version' musicforge-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cp -r musicforge-fpk fpk
          mkdir -p fpk/app/ui
          cp "target/${{ matrix.target }}/release/musicforge-server" fpk/app/
          cp "target/${{ matrix.target }}/release/musicforge" fpk/app/
          cp -r musicforge-gui/ui/dist/* fpk/app/ui/
          sed -i "s/^arch:.*/arch: ${{ matrix.arch }}/" fpk/manifest
          sed -i "s/^version:.*/version: $VERSION/" fpk/manifest
          chmod +x fpk/cmd/main

      - name: Download fnpack
        run: |
          curl -fL -o fnpack "${{ vars.FNPACK_URL }}" && chmod +x fnpack
          ./fnpack --version

      - name: Build FPK
        run: ./fnpack build fpk

      - name: Collect artifacts
        run: |
          mkdir -p fpk-out
          cp ./*.fpk fpk-out/ 2>/dev/null || find . -maxdepth 2 -name "*.fpk" -exec cp {} fpk-out/ \;
          ( cd fpk-out && sha256sum ./*.fpk > SHA256SUMS-fpk.txt )

      - uses: actions/upload-artifact@v4
        with:
          name: musicforge-fpk-${{ matrix.arch }}
          path: fpk-out/*

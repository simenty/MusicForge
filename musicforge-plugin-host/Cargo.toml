[package]
name = "musicforge-plugin-host"
version = "0.8.0"
edition.workspace = true
license.workspace = true
description = "Plugin process management: spawn, D20 handshake, NDJSON calls with timeout, kill isolation (P6a 预研)"

[dependencies]
musicforge-plugin-api = { path = "../musicforge-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# P6a 预研 mock 插件（D20/超时/kill 契约测试的可执行夹具；正式期移 examples/）
[[bin]]
name = "mock-ai-plugin"
path = "src/bin/mock_ai_plugin.rs"

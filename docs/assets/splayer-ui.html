<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPlayer — 音乐播放器界面</title>
<style>
/* ============================================================
   SPlayer UI — 按设计稿还原
   结构：左侧栏(Logo+菜单) | 右区(顶栏 + 主内容)
   风格：浅色极简（白/浅灰中性色、细边框、圆角卡片、无重装饰）
   约束：零依赖、系统字体栈、封面为渐变占位（真实项目替换为图片）
   ============================================================ */
:root {
  --bg-side: #f7f7f8;
  --bg: #ffffff;
  --bg-soft: #f2f3f5;
  --bg-active: #e9ebee;
  --bg-hover: #f2f3f5;
  --border: #ebedf0;
  --border-strong: #dfe2e6;
  --text: #1a1a1a;
  --text-2: #5c636e;
  --text-3: #8a8f99;
  --text-4: #b0b5bd;
  --danger: #e5484d;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-1: 0 1px 2px rgba(16, 20, 28, .04);
  --shadow-2: 0 6px 20px rgba(16, 20, 28, .10);
  --sidebar-w: 208px;
  --topbar-h: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  --dur: 160ms;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;                       /* 桌面壳语义：整窗不滚动，内容区自滚 */
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }

/* ======================= 布局骨架 ======================= */
.app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); height: 100%; }

/* ======================= 左侧栏 ======================= */
.sidebar {
  background: var(--bg-side);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.brand {
  height: var(--topbar-h); flex: none;
  display: flex; align-items: center; gap: 9px;
  padding: 0 18px;
}
.brand .mark {
  width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #2b2f36, #4a5058);
}
.brand b { font-size: 15.5px; font-weight: 650; letter-spacing: .2px; }

.nav { padding: 4px 10px 10px; overflow-y: auto; flex: 1; min-height: 0; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--border); margin: 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  height: 36px; padding: 0 10px; border-radius: var(--r-sm);
  color: var(--text-2); font-size: 13.5px; text-align: left; width: 100%;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.nav-item svg { flex: none; color: var(--text-3); }
.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.on { background: var(--bg-active); color: var(--text); font-weight: 600; }
.nav-item.on svg { color: var(--text); }
.nav-item .tail { margin-left: auto; color: var(--text-4); display: grid; place-items: center; }
.nav-item:hover .tail { color: var(--text-3); }

/* 我的歌单（可折叠分组 + 新建） */
.pl-head {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; height: 32px; margin-top: 4px;
  color: var(--text-3); font-size: 12.5px;
}
.pl-head .caret { transition: transform var(--dur) var(--ease); }
.pl-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.pl-add {
  margin-left: auto; width: 24px; height: 24px; border-radius: 6px;
  display: grid; place-items: center; color: var(--text-3);
}
.pl-add:hover { background: var(--bg-hover); color: var(--text); }
.pl-list { display: flex; flex-direction: column; gap: 2px; }
.pl-list[hidden] { display: none; }
.pl-empty { padding: 6px 12px 2px; font-size: 12px; color: var(--text-4); }

/* ======================= 右区 ======================= */
.main-wrap { display: grid; grid-template-rows: var(--topbar-h) minmax(0, 1fr); min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; flex: none;
  display: grid; place-items: center; color: var(--text-2);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn.square { border-radius: var(--r-sm); }

.search {
  position: relative; flex: 1; max-width: 460px; margin-left: 6px;
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-4); pointer-events: none; }
.search input {
  width: 100%; height: 36px; padding: 0 14px 0 36px;
  background: var(--bg-soft); border: 1px solid transparent; border-radius: 999px;
  font-size: 13px; outline: none;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search input::placeholder { color: var(--text-4); }
.search input:hover { background: #eeeef1; }
.search input:focus { background: var(--bg); border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(16, 20, 28, .05); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.divider { width: 1px; height: 22px; background: var(--border); margin: 0 6px; }
.win-controls { display: flex; align-items: center; gap: 2px; }
.win-btn {
  width: 34px; height: 30px; border-radius: var(--r-sm);
  display: grid; place-items: center; color: var(--text-2);
}
.win-btn:hover { background: var(--bg-hover); }
.win-btn.close:hover { background: #fdecec; color: var(--danger); }
/* 移动端才出现的汉堡（桌面壳无此控件） */
.menu-toggle { display: none; }

/* 主内容区（自滚动） */
.content { overflow-y: auto; padding: 26px 28px 40px; }

/* ---- 问候 + 统计 ---- */
.hero { display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
.hero h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: .2px; }
.hero .sub { margin: 7px 0 0; font-size: 13px; color: var(--text-3); }
.stats { margin-left: auto; display: flex; gap: 30px; padding-top: 4px; }
.stat { text-align: center; min-width: 62px; }
.stat .n { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 1px; }
.stat .l { margin-top: 3px; font-size: 11px; color: var(--text-4); }

/* ---- 快捷入口卡 ---- */
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-top: 22px; }
.qcard {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; text-align: left;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.qcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); transform: translateY(-1px); }
.qcard .ico { flex: none; color: var(--text-2); }
.qcard b { display: block; font-size: 13.5px; font-weight: 600; }
.qcard span { display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-3); }

/* ---- 区块标题 ---- */
.section { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; gap: 10px; }
.section-head h2 { margin: 0; font-size: 17px; font-weight: 650; }
.section-head .hint { font-size: 12px; color: var(--text-4); }

/* ---- 空状态卡（继续聆听） ---- */
.empty-card {
  margin-top: 14px; min-height: 152px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md);
  color: var(--text-4);
}
.empty-card p { margin: 0; font-size: 13px; color: var(--text-3); }

/* ---- 歌单网格 ---- */
.grid { margin-top: 14px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.plcard { display: block; text-align: left; }
.plcard .cover {
  position: relative; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden;
  box-shadow: var(--shadow-1);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.plcard:hover .cover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.plcard .cover::after {               /* 播放态遮罩（hover 时出现） */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.22));
  opacity: 0; transition: opacity var(--dur) var(--ease);
}
.plcard:hover .cover::after { opacity: 1; }
.plcard .play {
  position: absolute; right: 10px; bottom: 10px; z-index: 1;
  width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; color: var(--text);
  background: rgba(255,255,255,.92); box-shadow: var(--shadow-1);
  opacity: 0; transform: translateY(4px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
}
.plcard:hover .play { opacity: 1; transform: none; }
.plcard .t {
  margin-top: 9px; font-size: 13px; line-height: 1.45; color: var(--text);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* 封面占位：# 用渐变 + 图形模拟插画感，真实项目替换为 <img> */
.cover.c1 { background: linear-gradient(160deg, #dff3e6, #bfe7cf 60%, #a8dcc0); }
.cover.c2 { background: linear-gradient(160deg, #f6f7f8, #e7e9ec 60%, #d8dbe0); }
.cover.c3 { background: linear-gradient(160deg, #f3ead9, #e6d6b8 60%, #d9c49e); }
.cover.c4 { background: linear-gradient(160deg, #dbeaf6, #bcd8ef 60%, #a3c8e8); }
.cover.c5 { background: linear-gradient(160deg, #f7e3e0, #f0c9c2 60%, #e6b0a6); }
.cover.c6 { background: linear-gradient(160deg, #efe6f4, #ddcbe9 60%, #cbb3dd); }
.cover .art { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(20, 24, 30, .28); }

/* ======================= 响应式 ======================= */
@media (max-width: 1280px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
@media (max-width: 1080px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  :root { --sidebar-w: 0px; }
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 30; width: 232px;
    transform: translateX(-100%); transition: transform var(--dur) var(--ease);
    box-shadow: var(--shadow-2);
  }
  .app.nav-open .sidebar { transform: none; }
  .menu-toggle { display: grid; }
  .stats { margin-left: 0; width: 100%; justify-content: flex-start; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .content { padding: 20px 18px 32px; }
}
@media (max-width: 620px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .quick { grid-template-columns: minmax(0, 1fr); }
  .search { max-width: none; }
  .win-controls, .divider { display: none; }   /* 窄屏隐藏桌面壳控件（浏览器场景无意义） */
  .hero h1 { font-size: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ==================== 左侧栏 ==================== -->
  <aside class="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
        </svg>
      </span>
      <b>SPlayer</b>
    </div>

    <nav class="nav">
      <div class="nav-group">
        <button class="nav-item on">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v8a2 2 0 01-2 2h-4v-6h-4v6H6a2 2 0 01-2-2z"/></svg>
          首页
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
          音乐库
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.3-3.4 3.9-5 7-5s5.7 1.6 7 5"/></svg>
          艺术家
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/></svg>
          专辑
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          文件夹
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
          统计
        </button>
      </div>

      <div class="nav-sep" role="separator"></div>

      <div class="nav-group">
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.6A4 4 0 0112 7a4 4 0 017 3.4c0 5-7 9.6-7 9.6z"/></svg>
          我喜欢的音乐
          <span class="tail">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.6A4 4 0 0112 7a4 4 0 017 3.4c0 5-7 9.6-7 9.6z"/></svg>
          </span>
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.9l6-.8z"/></svg>
          我的收藏
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 000-9 6 6 0 00-11.6 1.6A3.7 3.7 0 006 19z"/></svg>
          我的云盘
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M8 19V9M12 19v-6M16 19v-9M20 19V7"/></svg>
          媒体源
        </button>
        <button class="nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1015 5.2M3.5 12A8.5 8.5 0 0118.5 6.8"/><path d="M3.5 6.5V12h5.5"/></svg>
          播放历史
        </button>
      </div>

      <div class="nav-sep" role="separator"></div>

      <div class="pl-head" id="plHead" role="button" tabindex="0" aria-expanded="true" aria-controls="plList">
        <span>我的歌单</span>
        <svg class="caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span class="pl-add" id="plAdd" role="button" tabindex="0" aria-label="新建歌单" title="新建歌单">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </span>
      </div>
      <div class="pl-list" id="plList"><div class="pl-empty">暂无歌单，点 + 新建</div></div>
    </nav>
  </aside>

  <!-- ==================== 右区 ==================== -->
  <div class="main-wrap">

    <!-- 顶栏 -->
    <header class="topbar">
      <button class="icon-btn square menu-toggle" id="menuToggle" aria-label="打开导航">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <button class="icon-btn" aria-label="后退" title="后退">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg>
      </button>
      <button class="icon-btn" aria-label="前进" title="前进" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg>
      </button>

      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20 20"/></svg>
        <input type="search" placeholder="搜索歌曲、歌手或专辑" aria-label="搜索">
      </label>
      <button class="icon-btn" aria-label="声音识别" title="声音识别">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12v.1M8 9v6M12 5.5v13M16 8v8M20 11v2"/></svg>
      </button>

      <div class="topbar-right">
        <button class="icon-btn" aria-label="账户" title="账户">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c1.3-3.3 3.9-4.9 7-4.9s5.7 1.6 7 4.9"/></svg>
        </button>
        <button class="icon-btn" aria-label="设置" title="设置">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2l-.1.1a2 2 0 11-2.8-2.8l.1-.1A1.7 1.7 0 003 15a2 2 0 010-4 1.7 1.7 0 001.2-2.9l-.1-.1a2 2 0 112.8-2.8l.1.1A1.7 1.7 0 0010 4.1a2 2 0 014 0 1.7 1.7 0 002.9 1.2l.1-.1a2 2 0 112.8 2.8l-.1.1A1.7 1.7 0 0021 11a2 2 0 010 4z"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <!-- 桌面壳窗口控件（浏览器中为视觉还原；Tauri/Electron 壳中绑定真实行为） -->
        <div class="win-controls">
          <button class="win-btn" aria-label="最小化" title="最小化"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7"><path d="M6 12h12"/></svg></button>
          <button class="win-btn" aria-label="最大化" title="最大化"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
          <button class="win-btn close" aria-label="关闭" title="关闭"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        </div>
      </div>
    </header>

    <!-- 主内容 -->
    <main class="content">

      <section class="hero">
        <div>
          <h1 id="greeting">下午好</h1>
          <p class="sub">愿今天有好音乐与你相伴</p>
        </div>
        <div class="stats" role="group" aria-label="收听统计">
          <div class="stat"><div class="n">0.0<small>h</small></div><div class="l">本周时长</div></div>
          <div class="stat"><div class="n">0<small>首</small></div><div class="l">新增收藏</div></div>
          <div class="stat"><div class="n">0<small>天</small></div><div class="l">连续收听</div></div>
        </div>
      </section>

      <section class="quick" aria-label="快捷入口">
        <button class="qcard">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 8.5l4 3.5-4 3.5z" fill="currentColor" stroke="none"/></svg></span>
          <span><b>试试手气</b><span>随机播放一首</span></span>
        </button>
        <button class="qcard">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 14.5l1.6 1.6 3.2-3.2"/></svg></span>
          <span><b>每日推荐</b><span>每天为你精选</span></span>
        </button>
        <button class="qcard">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-7-9.6A4 4 0 0112 7a4 4 0 017 3.4c0 5-7 9.6-7 9.6z"/></svg></span>
          <span><b>心动模式</b><span>根据喜好智能播放</span></span>
        </button>
        <button class="qcard">
          <span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 12v.1M8 9v6M12 5.5v13M16 8v8M20 11v2"/></svg></span>
          <span><b>私人 FM</b><span>为你不停推荐</span></span>
        </button>
      </section>

      <section class="section">
        <div class="section-head"><h2>继续聆听</h2></div>
        <div class="empty-card" role="status">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0116 0v2"/><path d="M4 14a2 2 0 012 2v2a2 2 0 01-4 0v-2a2 2 0 012-2zM20 14a2 2 0 012 2v2a2 2 0 01-4 0v-2a2 2 0 012-2z"/></svg>
          <p>还没有播放记录，去听点什么吧</p>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>推荐歌单</h2>
          <span class="hint">大家都在听的热门歌单</span>
        </div>
        <div class="grid" id="grid"><!-- 由下方脚本渲染（占位封面为 CSS 渐变） --></div>
      </section>

    </main>
  </div>
</div>

<script>
/* =========================================================================
 * SPlayer 原型交互（仅演示必要的状态，无业务逻辑）
 * ========================================================================= */

/* ---- 歌单网格：占位数据（封面用渐变类 c1..c6 + 中央图形） ---- */
const PLAYLISTS = [
  { t: "2026 超级好听的网易云热门流行歌曲", c: "c1", art: "note" },
  { t: "udg rapper/视觉系小子顶流最爱懂品歌单", c: "c2", art: "vinyl" },
  { t: "情歌教父｜周传雄的金曲TOP50", c: "c3", art: "mic" },
  { t: "慵懒纯音乐：舒缓缓放松，咖啡馆chill", c: "c4", art: "wave" },
  { t: "「学习专用」戴上耳机舒适度100%", c: "c5", art: "headphone" },
  { t: "200首好听听但记不起名字的神曲", c: "c6", art: "sparkle" },
  { t: "深夜电台：低音量的城市氛围", c: "c4", art: "moon" },
  { t: "华语民谣：故事都在歌词里", c: "c1", art: "guitar" },
  { t: "电子脉冲：通勤路上的节拍", c: "c6", art: "wave" },
  { t: "电影原声：记忆里的画面感", c: "c3", art: "film" },
  { t: "独立摇滚：地下室的声音", c: "c5", art: "mic" },
  { t: "古典钢琴：专注与沉思", c: "c2", art: "note" },
];

const ART = {
  note:      '<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
  vinyl:     '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/>',
  mic:       '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/>',
  wave:      '<path d="M4 12v.1M8 9v6M12 5.5v13M16 8v8M20 11v2"/>',
  headphone: '<path d="M4 14v-2a8 8 0 0116 0v2"/><path d="M4 14a2 2 0 012 2v2a2 2 0 01-4 0v-2a2 2 0 012-2zM20 14a2 2 0 012 2v2a2 2 0 01-4 0v-2a2 2 0 012-2z"/>',
  sparkle:   '<path d="M12 4l1.8 5.2L19 11l-5.2 1.8L12 18l-1.8-5.2L5 11l5.2-1.8z"/>',
  moon:      '<path d="M20 13.5A8 8 0 1110.5 4a6.2 6.2 0 009.5 9.5z"/>',
  guitar:    '<path d="M15 3l6 6-2 2-6-6z"/><circle cx="9" cy="15" r="5"/><circle cx="9" cy="15" r="1.6"/>',
  film:      '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8 5v14M16 5v14M3.5 9.5h17M3.5 14.5h17"/>',
};

const grid = document.getElementById("grid");
grid.innerHTML = PLAYLISTS.map((p) => `
  <a class="plcard" href="#" aria-label="歌单：${p.t}">
    <span class="cover ${p.c}">
      <span class="art">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ART[p.art] || ART.note}</svg>
      </span>
      <span class="play" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      </span>
    </span>
    <span class="t">${p.t}</span>
  </a>`).join("");

/* ---- 侧栏选中态 ---- */
document.querySelectorAll(".nav-item").forEach((it) =>
  it.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach((x) => x.classList.remove("on"));
    it.classList.add("on");
  })
);

/* ---- 「我的歌单」折叠 + 新建（演示：新建仅插入占位项） ---- */
const plHead = document.getElementById("plHead");
const plList = document.getElementById("plList");
function togglePlaylists() {
  const open = plHead.getAttribute("aria-expanded") === "true";
  plHead.setAttribute("aria-expanded", String(!open));
  plList.hidden = open;
}
plHead.addEventListener("click", (e) => { if (!e.target.closest(".pl-add")) togglePlaylists(); });
plHead.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); togglePlaylists(); } });
document.getElementById("plAdd").addEventListener("click", (e) => {
  e.stopPropagation();
  const empty = plList.querySelector(".pl-empty");
  if (empty) empty.remove();
  const n = plList.children.length + 1;
  const item = document.createElement("button");
  item.className = "nav-item";
  item.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>新建歌单 ' + n;
  plList.appendChild(item);
  plList.hidden = false;
  plHead.setAttribute("aria-expanded", "true");
});

/* ---- 问候语随时间 ---- */
(function greet() {
  const h = new Date().getHours();
  const g = h < 6 ? "凌晨好" : h < 12 ? "上午好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
  document.getElementById("greeting").textContent = g;
})();

/* ---- 窄屏侧栏抽屉 ---- */
const app = document.getElementById("app");
document.getElementById("menuToggle").addEventListener("click", () => app.classList.toggle("nav-open"));
document.addEventListener("click", (e) => {
  if (!app.classList.contains("nav-open")) return;
  if (e.target.closest(".sidebar") || e.target.closest("#menuToggle")) return;
  app.classList.remove("nav-open");
});
</script>
</body>
</html>

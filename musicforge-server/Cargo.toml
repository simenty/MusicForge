[package]
name = "musicforge-server"
version = "0.10.0"
edition = "2021"
license.workspace = true
description = "MusicForge headless HTTP server shell (axum) — SPA serving + token auth for NAS deployments (fnOS FPK)"

[dependencies]
# P8 壳层依赖（dependency-policy §4：server 壳允许 axum/tokio——core 仍禁）
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = "0.5"
# P1-2 可观测性：trace feature 用于请求日志中间件
# set-header：SPA 缓存策略（杜绝升级后旧 JS 被缓存 → MF-AUTH-SIG-MISSING）
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
# M2（RFC-0003 §4.2）：请求签名校验（HMAC-SHA256）——RustCrypto 官方 crate
# （MIT OR Apache-2.0，符合 dependency-policy 许可白名单；避免手写密码学）
hmac = "0.12"
sha2 = "0.10"
musicforge-core = { path = "../musicforge-core" }
# P8.2.2：convert API 经 cli 桥接（显式启用 plugin-host——NAS fpk 发行形态；
# D8 语义 = cli/core **默认 feature** 不含 host，server 为显式 opt-in）
musicforge-cli = { path = "../musicforge-cli", features = ["plugin-host"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

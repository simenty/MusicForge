[package]
name = "musicforge-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "MusicForge core: offline, streaming, CRC-verified NetEase .ncm decryption library"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
aes = "0.8"
lofty = "0.25"
crc32fast = "1"
thiserror = "2"
base64 = "0.22"
serde_json = "1"
# D17 增量哈希缓存（scan/convert 共用 files.sha256 缓存；CLI 侧原本就在用）
sha2 = "0.10"
# P4 similar_cover：仅内嵌封面（JPEG/PNG）解码供 8×8 aHash；关默认特性控体积
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# [profile.release] 只在 workspace 根定义（Cargo 语义：非根包的 profile 会被忽略，
# 保留重复副本只会制造"改了没生效"的漂移陷阱——QA 审计 K4，2026-09-03 移除）

[dev-dependencies]
tempfile = "3"

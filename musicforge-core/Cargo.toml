[package]
name = "musicforge-core"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "MusicForge core: offline, streaming, CRC-verified NetEase .ncm decryption library"

[dependencies]
aes = "0.8"
lofty = "0.25"
crc32fast = "1"
thiserror = "2"
base64 = "0.22"
serde_json = "1"

# [profile.release] 只在 workspace 根定义（Cargo 语义：非根包的 profile 会被忽略，
# 保留重复副本只会制造"改了没生效"的漂移陷阱——QA 审计 K4，2026-09-03 移除）

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

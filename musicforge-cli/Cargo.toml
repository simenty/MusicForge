[package]
name = "musicforge-cli"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "MusicForge CLI: offline, reliable, observable .ncm batch converter"

[[bin]]
name = "musicforge"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
# QA 对抗性测试：自建 NCM 编码器 + 标签读回
aes = "0.8"
base64 = "0.22"
crc32fast = "1"
lofty = "0.25"

[dependencies]
sha2 = "0.10"
serde_json = "1"
musicforge-core = { path = "../musicforge-core" }
clap = { version = "4", features = ["derive"] }
